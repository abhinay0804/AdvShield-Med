name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install flake8
      - name: Lint
        run: flake8 backend/ --max-line-length=120 --exclude=__pycache__,migrations --count --show-source --statistics || true
      - name: Verify Docker Compose
        run: docker compose config -q
